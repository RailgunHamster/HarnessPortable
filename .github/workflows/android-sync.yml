name: Android native API, settings and WebDAV sync

on:
  push:
    paths: ['app/**', 'settings.gradle.kts', 'spec/fixtures/**', 'spec/android-ui-api-gestures.json', 'scripts/*HarnessAndroidApi.ps1', 'scripts/test-fixtures/config-sync/**', 'scripts/test-fixtures/android-automation/**', 'scripts/test-fixtures/ssh-*.py', '.github/workflows/android-sync.yml']
  pull_request:
    paths: ['app/**', 'settings.gradle.kts', 'spec/fixtures/**', 'spec/android-ui-api-gestures.json', 'scripts/*HarnessAndroidApi.ps1', 'scripts/test-fixtures/config-sync/**', 'scripts/test-fixtures/android-automation/**', 'scripts/test-fixtures/ssh-*.py', '.github/workflows/android-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the disposable Android SDK and KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          fi
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'system-images;android-34;google_apis;x86_64' 'emulator'
      - name: Unit tests, lint, and isolated QA packages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-fixtures/android-automation/coverage.py
          bash gradlew --init-script scripts/test-fixtures/config-sync/android-qa.init.gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          python3 - <<'PY'
          import json
          data=json.load(open('app/build/outputs/apk/debug/output-metadata.json'))
          assert data['applicationId']=='com.harness.portable.syncqa', data['applicationId']
          PY
      - name: Real Android Keystore, conditional WebDAV, and settings tabs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-sync
          export ANDROID_USER_HOME="$RUNNER_TEMP/harness-sync-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'timeout 10 adb -s emulator-5554 logcat -d > artifacts/android-sync/logcat.log 2>&1 || true; timeout 10 adb -s emulator-5554 emu kill || true' EXIT
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name HarnessSyncCI --package 'system-images;android-34;google_apis;x86_64' --device pixel_5
          test -f "$ANDROID_AVD_HOME/HarnessSyncCI.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee artifacts/android-sync/avds.log
          "$ANDROID_HOME/emulator/emulator" -avd HarnessSyncCI -port 5554 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2 > artifacts/android-sync/emulator.log 2>&1 &
          timeout 90 adb -s emulator-5554 wait-for-device
          for i in $(seq 1 100); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          # Public semantic UI actions do not reset Android's inactivity timer.
          adb -s emulator-5554 shell svc power stayon true
          adb -s emulator-5554 shell settings put system screen_off_timeout 1800000
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          verification_failed=0
          python3 -m venv "$RUNNER_TEMP/ssh-fixtures"
          "$RUNNER_TEMP/ssh-fixtures/bin/pip" install 'paramiko==3.5.1'
          "$RUNNER_TEMP/ssh-fixtures/bin/python" -u scripts/test-fixtures/ssh-authentication-server.py > artifacts/android-sync/ssh-auth-server.log 2>&1 &
          "$RUNNER_TEMP/ssh-fixtures/bin/python" -u scripts/test-fixtures/ssh-hostkey-server.py > artifacts/android-sync/ssh-hostkey-server.log 2>&1 &
          for i in $(seq 1 50); do
            if grep -Fq 'Authentication fixture ready' artifacts/android-sync/ssh-auth-server.log && grep -Fq 'Host-key fixture ready' artifacts/android-sync/ssh-hostkey-server.log; then break; fi
            sleep .2
          done
          grep -F 'Authentication fixture ready' artifacts/android-sync/ssh-auth-server.log
          grep -F 'Host-key fixture ready' artifacts/android-sync/ssh-hostkey-server.log
          for port in 22221 22222 22223; do adb -s emulator-5554 reverse tcp:$port tcp:$port; done
          timeout 150 adb -s emulator-5554 shell am instrument -w -e class com.harness.portable.SshAuthenticationTests -e ssh_auth_fixture 22223 com.harness.portable.syncqa.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-sync/ssh-auth.log || verification_failed=1
          grep -F 'OK (7 tests)' artifacts/android-sync/ssh-auth.log || verification_failed=1
          timeout 150 adb -s emulator-5554 shell am instrument -w -e class com.harness.portable.SshHostKeyTests -e ssh_fixture 22221 -e ssh_changed_fixture 22222 com.harness.portable.syncqa.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-sync/ssh-hostkey.log || verification_failed=1
          grep -F 'OK (4 tests)' artifacts/android-sync/ssh-hostkey.log || verification_failed=1
          timeout 150 adb -s emulator-5554 shell am instrument -w -e class com.harness.portable.ConfigurationSyncNativeTests com.harness.portable.syncqa.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-sync/native.log || verification_failed=1
          grep -F 'OK (4 tests)' artifacts/android-sync/native.log || verification_failed=1
          for mode in normal small; do
            if [ "$mode" = small ]; then
              adb -s emulator-5554 shell wm size 720x1280
              adb -s emulator-5554 shell wm density 360
              adb -s emulator-5554 shell settings put system font_scale 1.3
            fi
            timeout 120 adb -s emulator-5554 shell am instrument -w -e class com.harness.portable.SettingsTabsNativeTests com.harness.portable.syncqa.test/androidx.test.runner.AndroidJUnitRunner | tee "artifacts/android-sync/tabs-$mode.log" || verification_failed=1
            grep -F 'OK (1 test)' "artifacts/android-sync/tabs-$mode.log" || verification_failed=1
            timeout 120 adb -s emulator-5554 shell am instrument -w -e class com.harness.portable.LibraryOrderNativeTests com.harness.portable.syncqa.test/androidx.test.runner.AndroidJUnitRunner | tee "artifacts/android-sync/order-$mode.log" || verification_failed=1
            grep -F 'OK (1 test)' "artifacts/android-sync/order-$mode.log" || verification_failed=1
            mkdir -p "artifacts/android-sync/$mode"
            for name in general-light security sync-light updates sync-dark order-light order-dark; do
              adb -s emulator-5554 exec-out run-as com.harness.portable.syncqa cat "files/qa-shots/$name.png" > "artifacts/android-sync/$mode/$name.png" || verification_failed=1
              test -s "artifacts/android-sync/$mode/$name.png" || verification_failed=1
            done
          done
          adb -s emulator-5554 shell wm size reset
          adb -s emulator-5554 shell wm density reset
          adb -s emulator-5554 shell settings put system font_scale 1.0
          adb -s emulator-5554 shell am force-stop com.harness.portable.syncqa
          adb -s emulator-5554 shell wm dismiss-keyguard
          timeout 180 adb -s emulator-5554 shell am instrument -w -e class com.harness.portable.automation.AndroidAutomationNativeTests com.harness.portable.syncqa.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-sync/automation-native.log || verification_failed=1
          grep -F 'OK (4 tests)' artifacts/android-sync/automation-native.log || verification_failed=1
          timeout 300 python3 -u scripts/test-fixtures/android-automation/smoke.py --serial emulator-5554 --output artifacts/android-sync/automation | tee artifacts/android-sync/automation.log || verification_failed=1
          timeout 120 pwsh -NoProfile -File scripts/test-fixtures/android-automation/cli-smoke.ps1 -Serial emulator-5554 | tee artifacts/android-sync/automation-cli.log || verification_failed=1
          test "$verification_failed" = 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-sync-verification
          path: |
            artifacts/android-sync/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
